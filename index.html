<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">  
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Boston North Station Dashboard</title>
    <style>
        /* Rotating Destination Background Theme */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #2a2a28; 
            color: #f3f1ec; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
        }

        /* Two crossfading full-screen photo layers, swapped every few minutes */
        .bg-photo { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-size: cover; background-position: center; 
            opacity: 0; 
            transition: opacity 3s ease-in-out; 
            z-index: 0; 
        }
        .bg-photo.is-visible { opacity: 1; }

        /* Dark scrim so tiles/text stay readable over any photo */
        .bg-scrim { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(180deg, rgba(20,18,15,0.25), rgba(20,18,15,0.38)); 
            z-index: 1; 
        }

        /* Bing "wallpaper of the day" caption, bottom of page */
        .bg-caption {
            position: fixed; left: 0; bottom: 0; width: 100%;
            box-sizing: border-box;
            padding: 6px 16px;
            font-size: 14px;
            color: rgba(255,255,255,0.85);
            text-shadow: 0 1px 3px rgba(0,0,0,0.7);
            background: linear-gradient(0deg, rgba(0,0,0,0.35), rgba(0,0,0,0));
            z-index: 3;
            text-align: right;
            transition: opacity 1s ease-in-out;
        }
        
        /* Dev Update Button */
        .dev-update-btn {
            position: fixed;
            bottom: 6px;
            left: 6px;
            z-index: 9999;
            background: rgba(0,0,0,0.3);
            color: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .dev-update-btn:active {
            background: rgba(255,255,255,0.3);
            color: #fff;
        }

        /* Pixel Shifting Dashboard Container */
        .dashboard { 
            position: relative; z-index: 2;
            display: flex; flex-direction: column;
            width: 96vw; height: 96vh; margin: 2vh 2vw;
            animation: pixelShift 300s infinite alternate ease-in-out;
        }

        @keyframes pixelShift {
            0%   { transform: translate(0, 0); }
            25%  { transform: translate(-1.5vw, -1.5vh); }
            50%  { transform: translate(1.5vw, -1vh); }
            75%  { transform: translate(1vw, 1.5vh); }
            100% { transform: translate(-1vh, 1vw); }
        }

        /* Two-Column Layout */
        .content-row {
            display: flex; flex-direction: row;
            width: 100%; flex: 1; min-height: 0;
        }
        .col-left { 
            width: 55%; padding: 0 10px 12px 10px; box-sizing: border-box; 
            display: flex; flex-direction: column; overflow-y: hidden; 
        }
        .col-right { 
            width: 45%; padding: 8px 10px 12px 10px; box-sizing: border-box; 
            display: flex; flex-direction: column; overflow-y: hidden; 
        }

        /* Full-width time + weather bar */
        .header-container {
            width: 100%; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 10px 7px;
            margin-bottom: 5px;
            border-radius: 14px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.16);
            -webkit-backdrop-filter: blur(7px);
            backdrop-filter: blur(7px);
            box-shadow: 0 4px 14px -4px rgba(0,0,0,0.20);
        }
        .header-time { font-size: 38px; font-weight: 600; color: #ffffff; text-shadow: 0 2px 6px rgba(0,0,0,0.78); }

        /* Hello World */
        .hello-world {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 3px 8px rgba(0,0,0,0.9);
            padding: 4px 0 6px;
        }

        /* MBTA Subway Grid (2x2) */
        .subway-grid { 
            display: -ms-grid;
            display: grid; 
            grid-template-columns: max-content max-content;
            grid-auto-rows: max-content;
            grid-gap: 7px;
            gap: 7px;
            justify-content: center; 
            align-items: stretch;
        }
        .subway-quadrant { 
            background: rgba(255,255,255,0.1); 
            -webkit-backdrop-filter: blur(7px); 
            backdrop-filter: blur(7px); 
            border-radius: 12px; 
            padding: 5.5px 2.2px; box-sizing: border-box;
            border-top: 6px solid #555;
            box-shadow: 0 4px 14px -4px rgba(0,0,0,0.25); 
            text-align: center;
            width: 100%;
            max-width: none;
            min-width: 0;
        }
        .quad-orange { border-top-color: #f97316; } 
        .quad-green { border-top-color: #10b981; }
        
        .quad-title { font-size: 54px; font-weight: bold; margin-bottom: 0; color: rgba(255,255,255,0.9); text-transform: uppercase; letter-spacing: 0.5px; text-shadow: 0 2px 5px rgba(0,0,0,0.78);}
        .train-row { 
            display: flex; justify-content: center; 
            margin-bottom: 4px; 
            font-size: 54px; 
        }
        .time-away { font-weight: bold; color: #6fe3a5; text-shadow: 0 2px 5px rgba(0,0,0,0.78); }
        .quad-orange .time-away {color: #f97316;}
        .quad-green .time-away {color: #6fe3a5;}

        .header-weather { 
            display: flex; align-items: baseline;
            font-size: 24px; 
            white-space: nowrap;
        }
        .header-weather > span { margin-left: 5px; }
        .header-weather > span:first-child { margin-left: 0; }

        /* Compact transitioning headlines beneath the clock/weather header */
        .ticker-row {
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 8px;
        }
        .ticker {
            display: flex;
            align-items: stretch;
            overflow: hidden;
            width: 100%;
            height: 33px; /* Fixed height to prevent jumping */
            padding: 0;
            box-sizing: border-box;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.10);
            -webkit-backdrop-filter: blur(7px);
            backdrop-filter: blur(7px);
            position: relative;
        }
        .ticker-label {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 112px;
            flex-shrink: 0;
            box-sizing: border-box;
            padding: 0 10px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            background: rgba(25,25,23,0.96);
            border-right: 1px solid rgba(255,255,255,0.12);
            -webkit-backdrop-filter: blur(7px);
            backdrop-filter: blur(7px);
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            position: relative;
            z-index: 20;
        }
        
        /* New Fade-Transition CSS for tickers */
        .ticker-track {
            flex-grow: 1;
            min-width: 0;
            overflow: hidden;
            position: relative;
            z-index: 1;
            display: block;
            box-sizing: border-box;
        }
        .ticker-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 12px;
            box-sizing: border-box;
            font-size: 24px;
            line-height: 1.15;
            color: #ffffff;
            text-shadow: 0 3px 8px rgba(0,0,0,0.95);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* Safari-safe truncation for long headlines */
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            pointer-events: none;
        }
        .ticker-item.active {
            opacity: 1;
        }

        .ticker-sports .ticker-label { color: #ff8a7
