<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">  
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Boston North Station Dashboard</title>
    <style>
        /* Rotating Destination Background Theme */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #2a2a28; 
            color: #f3f1ec; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
        }

        /* Two crossfading full-screen photo layers, swapped every few minutes */
        .bg-photo { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-size: cover; background-position: center; 
            opacity: 0; 
            transition: opacity 3s ease-in-out; 
            z-index: 0; 
        }
        .bg-photo.is-visible { opacity: 1; }

        /* Dark scrim so tiles/text stay readable over any photo */
        .bg-scrim { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(180deg, rgba(20,18,15,0.25), rgba(20,18,15,0.38)); 
            z-index: 1; 
        }

        /* Bing "wallpaper of the day" caption, bottom of page */
        .bg-caption {
            position: fixed; left: 0; bottom: 0; width: 100%;
            box-sizing: border-box;
            padding: 6px 16px;
            font-size: 14px;
            color: rgba(255,255,255,0.85);
            text-shadow: 0 1px 3px rgba(0,0,0,0.7);
            background: linear-gradient(0deg, rgba(0,0,0,0.35), rgba(0,0,0,0));
            z-index: 3;
            text-align: right;
            transition: opacity 1s ease-in-out;
        }
        
        /* Dev Update Button */
        .dev-update-btn {
            position: fixed;
            bottom: 6px;
            left: 6px;
            z-index: 9999;
            background: rgba(0,0,0,0.3);
            color: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .dev-update-btn:active {
            background: rgba(255,255,255,0.3);
            color: #fff;
        }

        /* Pixel Shifting Dashboard Container */
        .dashboard { 
            position: relative; z-index: 2;
            display: flex; flex-direction: column;
            width: 96vw; height: 96vh; margin: 2vh 2vw;
            animation: pixelShift 300s infinite alternate ease-in-out;
        }

        @keyframes pixelShift {
            0%   { transform: translate(0, 0); }
            25%  { transform: translate(-1.5vw, -1.5vh); }
            50%  { transform: translate(1.5vw, -1vh); }
            75%  { transform: translate(1vw, 1.5vh); }
            100% { transform: translate(-1vh, 1vw); }
        }

        /* Two-Column Layout */
        .content-row {
            display: flex; flex-direction: row;
            width: 100%; flex: 1; min-height: 0;
        }
        .col-left { 
            width: 55%; padding: 0 10px 12px 10px; box-sizing: border-box; 
            display: flex; flex-direction: column; overflow-y: hidden; 
        }
        .col-right { 
            width: 45%; padding: 8px 10px 12px 10px; box-sizing: border-box; 
            display: flex; flex-direction: column; overflow-y: hidden; 
        }

        /* Full-width time + weather bar */
        .header-container {
            width: 100%; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 10px 7px;
            margin-bottom: 8px;
            border-radius: 14px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.16);
            -webkit-backdrop-filter: blur(7px);
            backdrop-filter: blur(7px);
            box-shadow: 0 4px 14px -4px rgba(0,0,0,0.20);
        }
        .header-time { font-size: 38px; font-weight: 600; color: #ffffff; text-shadow: 0 2px 6px rgba(0,0,0,0.78); }

        /* MBTA Subway Grid (2x2) */
        .subway-grid { 
            display: -ms-grid;
            display: grid; 
            grid-template-columns: max-content max-content;
            grid-auto-rows: max-content;
            grid-gap: 7px;
            gap: 7px;
            justify-content: center; 
            align-items: stretch;
        }
        .subway-quadrant { 
            background: rgba(255,255,255,0.1); 
            -webkit-backdrop-filter: blur(7px); 
            backdrop-filter: blur(7px); 
            border-radius: 12px; 
            padding: 5.5px 2.2px; box-sizing: border-box;
            border-top: 6px solid #555;
            box-shadow: 0 4px 14px -4px rgba(0,0,0,0.25); 
            text-align: center;
            width: 100%;
            max-width: none;
            min-width: 0;
        }
        .quad-orange { border-top-color: #f97316; } 
        .quad-green { border-top-color: #10b981; }
        
        .quad-title { font-size: 54px; font-weight: bold; margin-bottom: 0; color: rgba(255,255,255,0.9); text-transform: uppercase; letter-spacing: 0.5px; text-shadow: 0 2px 5px rgba(0,0,0,0.78);}
        .train-row { 
            display: flex; justify-content: center; 
            margin-bottom: 4px; 
            font-size: 54px; 
        }
        .time-away { font-weight: bold; color: #6fe3a5; text-shadow: 0 2px 5px rgba(0,0,0,0.78); }
        .quad-orange .time-away {color: #f97316;}
        .quad-green .time-away {color: #6fe3a5;}

        .header-weather { 
            display: flex; align-items: baseline;
            font-size: 24px; 
            white-space: nowrap;
        }
        .header-weather > span { margin-left: 5px; }
        .header-weather > span:first-child { margin-left: 0; }

        /* Ticker rows for Sports and 3 Event Bars */
        .ticker-row {
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 12px;
        }
        .ticker {
            display: flex;
            align-items: stretch;
            overflow: hidden;
            width: 100%;
            height: 33px; /* Fixed height to prevent jumping */
            padding: 0;
            box-sizing: border-box;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.10);
            -webkit-backdrop-filter: blur(7px);
            backdrop-filter: blur(7px);
            position: relative;
        }
        
        .ticker-track {
            flex-grow: 1;
            min-width: 0;
            overflow: hidden;
            position: relative;
            z-index: 1;
            display: block;
            box-sizing: border-box;
        }
        .ticker-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 14px;
            box-sizing: border-box;
            font-size: 24px;
            line-height: 1.15;
            color: #ffffff;
            text-shadow: 0 3px 8px rgba(0,0,0,0.95);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* Truncates the end of the description */
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            pointer-events: none;
        }
        .ticker-item.active {
            opacity: 1;
        }

        /* Inline prefix standardizing to crisp white */
        .prefix-label { font-weight: 800; color: #ffffff; margin-right: 8px; text-transform: uppercase; }

        .hw-temp { font-size: 38px; font-weight: 600; color: #ffffff; text-shadow: 0 2px 6px rgba(0,0,0,0.78); }
        .hw-desc { font-size: 30px; color: #f3f1ec; font-weight: 500; text-shadow: 0 2px 6px rgba(0,0,0,0.78); }
        .hw-details { font-size: 30px; color: rgba(255,255,255,0.9); font-weight: 500; text-shadow: 0 2px 6px rgba(0,0,0,0.78); }

        /* Alerts List */
        #alerts-container { margin-top: 10px; }
        .alert-item { 
            background: rgba(217,83,79,0.25); 
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border-left: 5px solid #d9534f; 
            padding: 8px 12px;
            margin-bottom: 6px; 
            font-size: 24px; 
            line-height: 1.3; 
            border-radius: 8px; 
            color: #ffffff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.78);
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .alert-good { 
            background: rgba(43,122,89,0.25); 
            border-left-color: #2b7a59; 
            color: #ffffff;
        }

        /* Periodic photo-only mode */
        body.photo-only .dashboard { opacity: 0; pointer-events: none; }
        body.photo-only .bg-scrim { opacity: 0.04; }
        body.photo-only .bg-caption { opacity: 1; }
        body.photo-only .dev-update-btn { opacity: 0; }
        .dashboard { transition: opacity 1.2s ease-in-out; }

    </style>
</head>
<body>

    <div id="bg-layer-1" class="bg-photo is-visible"></div>
    <div id="bg-layer-2" class="bg-photo"></div>
    <div class="bg-scrim"></div>
    <div id="bg-caption" class="bg-caption"></div>
    
    <!-- DEV UPDATE BUTTON -->
    <button id="dev-update-btn" class="dev-update-btn">Update Now</button>

    <div class="dashboard">
        <div class="header-container">
            <div id="main-clock" class="header-time">--:--</div>
            <div class="header-weather" id="header-weather">
                <span class="hw-temp" id="weather-temp">--°F</span>
                <span class="hw-desc" id="weather-desc">Loading...</span>
                <span class="hw-details" id="weather-details">H: --° | L: --° | Rain: --%</span>
            </div>
        </div>

        <div class="ticker-row">
            <div class="ticker ticker-sports">
                <div class="ticker-track" id="sports-ticker">
                    <span class="ticker-item active">Loading sports data...</span>
                </div>
            </div>
            <div class="ticker ticker-events">
                <div class="ticker-track" id="events-ticker-1">
                    <span class="ticker-item active">Loading events...</span>
                </div>
            </div>
            <div class="ticker ticker-events">
                <div class="ticker-track" id="events-ticker-2">
                    <span class="ticker-item active">Loading events...</span>
                </div>
            </div>
            <div class="ticker ticker-events">
                <div class="ticker-track" id="events-ticker-3">
                    <span class="ticker-item active">Loading events...</span>
                </div>
            </div>
        </div>

        <div class="content-row">
            <!-- Main Area: Subway & Alerts -->
            <div class="col-left" style="width:100%; padding:0 10px 12px 10px;">
                <div class="subway-grid">
                    <!-- Orange Line Southbound -->
                    <div class="subway-quadrant quad-orange">
                        <div class="quad-title">Forest Hills</div>
                        <div id="orange-inbound"><div class="train-row">Loading...</div></div>
                    </div>

                    <!-- Orange Line Northbound -->
                    <div class="subway-quadrant quad-orange">
                        <div class="quad-title">Oak Grove</div>
                        <div id="orange-outbound"><div class="train-row">Loading...</div></div>
                    </div>

                    <!-- Green Line Westbound -->
                    <div class="subway-quadrant quad-green">
                        <div class="quad-title">Westbound</div>
                        <div id="green-inbound"><div class="train-row">Loading...</div></div>
                    </div>

                    <!-- Green Line Eastbound -->
                    <div class="subway-quadrant quad-green">
                        <div class="quad-title">Eastbound</div>
                        <div id="green-outbound"><div class="train-row">Loading...</div></div>
                    </div>
                </div>

                <div id="alerts-container">
                    <div class="alert-item">Checking alerts...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 0. HARD REFRESH & MEMORY CLEAR ---
        function performHardUpdate() {
            window.location.reload(true);
        }
        setTimeout(performHardUpdate, 12 * 60 * 60 * 1000); 
        document.getElementById('dev-update-btn').addEventListener('click', performHardUpdate);


        // --- 1. ROTATING BING "WALLPAPER OF THE DAY" BACKGROUND ---
        var BING_PROXY = 'https://bingw.jasonzeng.dev/';
        var bingImages = []; 
        var bgIndex = -1;
        var bgShowingLayer1 = true;

        function fetchBingDay(index) {
            return fetch(BING_PROXY + '?resolution=1920x1080&index=' + index + '&format=json', { cache: 'no-store' })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    return { url: data.url, caption: (data.title ? data.title + ' — ' : '') + data.copyright };
                })
                .catch(function() { return null; });
        }

        function preloadAndSwap(entry) {
            var img = new Image();
            img.onload = function() {
                var showEl = document.getElementById(bgShowingLayer1 ? 'bg-layer-2' : 'bg-layer-1');
                var hideEl = document.getElementById(bgShowingLayer1 ? 'bg-layer-1' : 'bg-layer-2');
                showEl.style.backgroundImage = 'url(' + entry.url + ')';
                showEl.classList.add('is-visible');
                hideEl.classList.remove('is-visible');
                bgShowingLayer1 = !bgShowingLayer1;

                var captionEl = document.getElementById('bg-caption');
                captionEl.style.opacity = 0;
                setTimeout(function() {
                    captionEl.innerText = entry.caption || '';
                    captionEl.style.opacity = 1;
                }, 300);
            };
            img.src = entry.url;
        }

        function rotateBackground() {
            if (bingImages.length === 0) return;
            bgIndex = (bgIndex + 1) % bingImages.length;
            preloadAndSwap(bingImages[bgIndex]);
        }

        Promise.all([0, 1, 2, 3, 4, 5].map(fetchBingDay))
        .then(function(results) {
            bingImages = results.filter(function(r) { return r && r.url; });
            if (bingImages.length > 0) {
                rotateBackground();
                setInterval(rotateBackground, 60000); 
            }
        });


        // --- 2. CLOCK ---
        function updateClock() {
            var now = new Date();
            var timeString = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            document.getElementById('main-clock').innerText = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();


        // --- 3. MBTA SUBWAY LOGIC ---
        function fetchSubway() {
            var url = 'https://api-v3.mbta.com/predictions?filter[stop]=place-north&include=route,trip';
            fetch(url, { cache: 'no-store' })
            .then(function(res) { return res.json(); })
            .then(function(json) {
                if (!json.data || json.data.length === 0) return;

                var orangeIn = [], orangeOut = [], greenIn = [], greenOut = [];
                var seenTrips = {};

                var sortedData = json.data.sort(function(a, b) {
                    var tA = a.attributes.departure_time || a.attributes.arrival_time;
                    var tB = b.attributes.departure_time || b.attributes.arrival_time;
                    if (!tA && !tB) return 0; 
                    if (!tA) return 1;
                    if (!tB) return -1;
                    return new Date(tA).getTime() - new Date(tB).getTime();
                });

                for (var i = 0; i < sortedData.length; i++) {
                    var p = sortedData[i];
                    var routeData = p.relationships && p.relationships.route && p.relationships.route.data;
                    if (!routeData) continue;

                    var isOrange = routeData.id === 'Orange';
                    var isGreen = routeData.id.indexOf('Green') !== -1;
                    if (!isOrange && !isGreen) continue;

                    var tripData = p.relationships && p.relationships.trip && p.relationships.trip.data;
                    var tripId = tripData ? tripData.id : null;
                    if (tripId) {
                        if (seenTrips[tripId]) continue;
                        seenTrips[tripId] = true;
                    }

                    var direction = p.attributes.direction_id; 
                    var targetTime = p.attributes.departure_time || p.attributes.arrival_time;
                    
                    if (targetTime) {
                        var diffMs = new Date(targetTime).getTime() - new Date().getTime();
                        var diffMins = Math.floor(diffMs / 60000);
                        if (diffMins < -1) continue; 
                        
                        var timeVal = diffMins <= 0 ? 'BRD' : diffMins;

                        if (isOrange && direction === 0) orangeIn.push(timeVal);
                        if (isOrange && direction === 1) orangeOut.push(timeVal);
                        if (isGreen && direction === 0) greenIn.push(timeVal);
                        if (isGreen && direction === 1) greenOut.push(timeVal);
                    }
                }

                function renderQuad(id, arr) {
                    var el = document.getElementById(id);
                    if (arr.length === 0) {
                        el.innerHTML = '<div class="train-row">No trains</div>';
                        return;
                    }
                    var sliced = arr.slice(0, 3);
                    var hasNumber = false;
                    for(var k=0; k<sliced.length; k++) {
                        if (sliced[k] !== 'BRD') hasNumber = true;
                    }
                    var displayString = sliced.join(', ');
                    if (hasNumber) displayString += ' min';
                    el.innerHTML = '<div class="train-row"><span class="time-away">' + displayString + '</span></div>';
                }

                renderQuad('orange-inbound', orangeIn);
                renderQuad('orange-outbound', orangeOut);
                renderQuad('green-inbound', greenIn);
                renderQuad('green-outbound', greenOut);
            })
            .catch(function(err) { console.error('MBTA Fetch Error:', err); });
        }


        // --- 4. MBTA SERVICE ALERTS ---
        function fetchAlerts() {
            var url = 'https://api-v3.mbta.com/alerts?filter[stop]=place-north&filter[route_type]=0,1';
            fetch(url, { cache: 'no-store' })
            .then(function(res) { return res.json(); })
            .then(function(json) {
                var container = document.getElementById('alerts-container');
                if (!json.data || json.data.length === 0) {
                    container.innerHTML = '<div class="alert-item alert-good">All clear. No active subway alerts.</div>';
                    return;
                }
                var html = '';
                for (var i = 0; i < json.data.length; i++) {
                    var alertText = json.data[i].attributes.short_header || json.data[i].attributes.header || 'Active service alert.';
                    html += '<div class="alert-item">' + alertText + '</div>';
                }
                container.innerHTML = html;
            });
        }


        // --- 5. WEATHER ---
        function fetchWeather() {
            var url = 'https://api.open-meteo.com/v1/forecast?latitude=42.3601&longitude=-71.0589&current_weather=true&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=America%2FNew_York';
            fetch(url, { cache: 'no-store' })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.current_weather) {
                    document.getElementById('weather-temp').innerText = Math.round(data.current_weather.temperature) + '°F';
                    var code = data.current_weather.weathercode;
                    var desc = 'Clear';
                    if (code >= 1 && code <= 3) desc = 'Partly Cloudy';
                    if (code == 45 || code == 48) desc = 'Fog';
                    if (code >= 51 && code <= 55) desc = 'Drizzle';
                    if (code >= 61 && code <= 65) desc = 'Rain';
                    if (code >= 71 && code <= 75) desc = 'Snow';
                    if (code >= 95) desc = 'Thunderstorm';
                    document.getElementById('weather-desc').innerText = desc;
                }
                if (data.daily) {
                    var high = Math.round(data.daily.temperature_2m_max[0]);
                    var low = Math.round(data.daily.temperature_2m_min[0]);
                    var rainChance = data.daily.precipitation_probability_max[0] || 0;
                    document.getElementById('weather-details').innerText = 'H: ' + high + '° | L: ' + low + '° | Rain: ' + rainChance + '%';
                }
            });
        }


        // --- 6. TICKER CYCLING ---
        var tickerIntervals = {};

        function renderTicker(id, items, prefix, durationMs, staggerMs) {
            var container = document.getElementById(id);
            if (!container) return;
            if (!items || items.length === 0) items = ['No information available.'];

            var html = '';
            for (var i = 0; i < items.length; i++) {
                html += '<span class="ticker-item ' + (i === 0 ? 'active' : '') + '">';
                if (prefix) {
                    html += '<span class="prefix-label">' + prefix + ':</span>';
                }
                html += items[i] + '</span>';
            }
            container.innerHTML = html;

            if (tickerIntervals[id]) clearInterval(tickerIntervals[id]);

            var nodes = container.querySelectorAll('.ticker-item');
            if (nodes.length > 1) {
                var currentIndex = 0;
                // Add a timeout stagger so the 3 event bars don't flip simultaneously
                setTimeout(function() {
                    tickerIntervals[id] = setInterval(function() {
                        if (!container.isConnected) {
                            clearInterval(tickerIntervals[id]);
                            return;
                        }
                        nodes[currentIndex].classList.remove('active');
                        currentIndex = (currentIndex + 1) % nodes.length;
                        nodes[currentIndex].classList.add('active');
                    }, durationMs || 6000); 
                }, staggerMs || 0);
            }
        }


        // --- 7. SPORTS ---
        function fetchSports() {
            function getFormatDate(offsetDays) {
                var d = new Date();
                d.setDate(d.getDate() + offsetDays);
                var yy = d.getFullYear();
                var mm = ('0' + (d.getMonth() + 1)).slice(-2);
                var dd = ('0' + d.getDate()).slice(-2);
                return yy + mm + dd;
            }
            var dateRange = getFormatDate(-1) + '-' + getFormatDate(2);
            var urls = [
                'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard?dates=' + dateRange,
                'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=' + dateRange,
                'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=' + dateRange,
                'https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard?dates=' + dateRange
            ];

            var myTeams = ['Boston Red Sox', 'Washington Nationals', 'Washington Commanders', 'Boston Celtics', 'Duke Blue Devils'];
            var allGames = [];

            Promise.all(urls.map(function(u) {
                return fetch(u, {cache: 'no-store'}).then(function(res) { return res.json(); }).catch(function(){ return {events:[]}; });
            }))
            .then(function(results) {
                results.forEach(function(league) {
                    if (league.events) allGames = allGames.concat(league.events);
                });

                var html = '';
                var gamesFound = 0;
                var pastGamesPerTeam = {}; 
                var futureGamesPerTeam = {}; 
                allGames.sort(function(a,b) { return new Date(a.date).getTime() - new Date(b.date).getTime(); });

                for (var i = 0; i < allGames.length; i++) {
                    var game = allGames[i];
                    var comp = game.competitions[0];
                    var homeTeam = comp.competitors[0];
                    var awayTeam = comp.competitors[1];

                    var matchedTeams = [];
                    if (myTeams.indexOf(homeTeam.team.displayName) !== -1) matchedTeams.push(homeTeam.team.displayName);
                    if (myTeams.indexOf(awayTeam.team.displayName) !== -1) matchedTeams.push(awayTeam.team.displayName);

                    if (matchedTeams.length === 0) continue;

                    var status = game.status.type;
                    var isFinal = (status.name === 'STATUS_FINAL');
                    var isLive = (status.state === 'in');

                    var shouldShow = false;
                    for (var m = 0; m < matchedTeams.length; m++) {
                        var tName = matchedTeams[m];
                        if (isFinal) {
                            if (!pastGamesPerTeam[tName]) { pastGamesPerTeam[tName] = true; shouldShow = true; }
                        } else if (isLive) {
                            shouldShow = true; 
                        } else {
                            if (!futureGamesPerTeam[tName]) { futureGamesPerTeam[tName] = true; shouldShow = true; }
                        }
                    }

                    if (!shouldShow) continue;
                    gamesFound++;
                    var vsText = (awayTeam.team.shortDisplayName || awayTeam.team.name) + ' @ ' + (homeTeam.team.shortDisplayName || homeTeam.team.name);
                    var statusHtml = '';

                    if (isFinal) {
                        statusHtml = awayTeam.score + ' - ' + (homeTeam.score || '0');
                    } else if (isLive) {
                        statusHtml = '<span style="color:#ff8a75;">LIVE:</span> ' + awayTeam.score + ' - ' + homeTeam.score; 
                    } else {
                        var gDate = new Date(game.date);
                        var dayStr = gDate.toLocaleDateString('en-US', { weekday: 'short' });
                        var timeStr = gDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                        statusHtml = dayStr + ' ' + timeStr;
                    }

                    html += vsText + '  |  ' + statusHtml;
                    html += '|||';
                }

                if (gamesFound === 0) {
                    renderTicker('sports-ticker', ['No recent or upcoming games found.'], 'Sports', 6000, 0);
                } else {
                    var items = html.split('|||').filter(Boolean);
                    renderTicker('sports-ticker', items, 'Sports', 6000, 0);
                }
            });
        }


                // --- 8. LOCAL BOSTON EVENTS (Direct HTML Scrape with Auto-Failover) ---
        function fetchEvents() {
            var targetUrl = 'https://www.thebostoncalendar.com/events?tags%5B%5D=Art&tags%5B%5D=Date%20Idea&tags%5B%5D=Festivals%20%26%20Fairs&tags%5B%5D=Food&tags%5B%5D=Music&tags%5B%5D=Seasonal&weekend=1';
            
            // A list of fallback proxies to ensure the dashboard stays alive if one gets blocked
            var proxies = [
                'https://api.codetabs.com/v1/proxy?quest=',
                'https://api.allorigins.win/raw?url='
            ];

            function tryProxy(index) {
                if (index >= proxies.length) {
                    var errList = ["Event fetch error: Proxies blocked (403/CORS). Will retry later."];
                    renderTicker('events-ticker-1', errList, 'DEBUG', 6000, 0);
                    renderTicker('events-ticker-2', errList, 'DEBUG', 6000, 0);
                    renderTicker('events-ticker-3', errList, 'DEBUG', 6000, 0);
                    return;
                }

                var proxyUrl = proxies[index] + encodeURIComponent(targetUrl);

                fetch(proxyUrl, { cache: 'no-store' })
                .then(function(res) { 
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    return res.text(); 
                })
                .then(function(htmlText) {
                    // Check if the proxy returned an error page instead of the calendar HTML
                    if (!htmlText || htmlText.indexOf('li class="event"') === -1) {
                         throw new Error("Invalid HTML returned from proxy");
                    }

                    var parser = new DOMParser();
                    var doc = parser.parseFromString(htmlText, "text/html");
                    
                    var eventNodes = doc.querySelectorAll('li.event');
                    var filteredEvents = [];

                    for (var i = 0; i < eventNodes.length; i++) {
                        var node = eventNodes[i];
                        
                        var rawTitle = node.querySelector('h3') ? node.querySelector('h3').textContent.trim() : '';
                        var rawTime = node.querySelector('.time') ? node.querySelector('.time').textContent.replace(/\s+/g, ' ').trim() : '';
                        var rawLoc = node.querySelector('.location') ? node.querySelector('.location').textContent.trim() : 'Boston';
                        var rawDesc = node.querySelector('.description') ? node.querySelector('.description').textContent.trim() : '';
                        
                        var isRecurring = /recurring|ongoing|every/i.test(rawTitle) || /recurring|ongoing|every/i.test(rawDesc);
                        if (isRecurring) continue;

                        var cleanDesc = rawDesc.replace(/\s+/g, " ").trim();
                        if (cleanDesc.length > 100) cleanDesc = cleanDesc.substring(0, 100) + '...';
                        
                        var displayDate = rawTime.replace(/(?:, \d{4}| at | \d{1,2}:\d{2}\s*(am|pm|AM|PM)).*/, '').trim() || 'This Wknd';
                        var displayLoc = rawLoc.split(',')[0].trim();

                        var displayStr = "<span style='color:#6fe3a5;'>" + displayDate + "</span>  |  " + 
                                         "<span style='font-weight:600;'>" + rawTitle + "</span>  |  " + 
                                         displayLoc + "  |  " + 
                                         "<span style='opacity:0.8; font-size: 21px;'>" + cleanDesc + "</span>";
                        
                        filteredEvents.push(displayStr);
                    }

                    if (filteredEvents.length === 0) {
                        filteredEvents = ["No upcoming events matched your weekend filters."];
                    }

                    var list1 = [], list2 = [], list3 = [];
                    for (var j = 0; j < filteredEvents.length; j++) {
                        if (j % 3 === 0) list1.push(filteredEvents[j]);
                        else if (j % 3 === 1) list2.push(filteredEvents[j]);
                        else list3.push(filteredEvents[j]);
                    }
                    
                    if (list1.length === 0) list1 = filteredEvents;
                    if (list2.length === 0) list2 = filteredEvents;
                    if (list3.length === 0) list3 = filteredEvents;

                    renderTicker('events-ticker-1', list1, 'Event', 3000, 0);
                    renderTicker('events-ticker-2', list2, 'Event', 3000, 1000);
                    renderTicker('events-ticker-3', list3, 'Event', 3000, 2000);
                })
                .catch(function(err) {
                    console.warn("Proxy " + index + " failed:", err.message, "- Trying next proxy...");
                    tryProxy(index + 1); // Trigger the fallback
                });
            }

            tryProxy(0); // Start the chain with the first proxy
        }


        // --- 9. PHOTO-ONLY REST PERIOD / TOUCH TO RETURN ---
        var PHOTO_ONLY_AFTER_MS = 2 * 60 * 60 * 1000;
        var PHOTO_ONLY_DURATION_MS = 45 * 1000;
        var photoOnlyTimer = null;
        var photoOnlyExitTimer = null;

        function exitPhotoOnlyMode() {
            if (!document.body.classList.contains('photo-only')) return;
            document.body.classList.remove('photo-only');
            if (photoOnlyExitTimer) {
                clearTimeout(photoOnlyExitTimer);
                photoOnlyExitTimer = null;
            }
            schedulePhotoOnlyMode();
        }

        function enterPhotoOnlyMode() {
            document.body.classList.add('photo-only');
            photoOnlyExitTimer = setTimeout(exitPhotoOnlyMode, PHOTO_ONLY_DURATION_MS);
        }

        function schedulePhotoOnlyMode() {
            if (photoOnlyTimer) clearTimeout(photoOnlyTimer);
            photoOnlyTimer = setTimeout(enterPhotoOnlyMode, PHOTO_ONLY_AFTER_MS);
        }

        document.addEventListener('touchend', exitPhotoOnlyMode, false);
        document.addEventListener('click', exitPhotoOnlyMode, false);
        schedulePhotoOnlyMode();


        // --- 10. TIMERS & INITIALIZATION ---
        function updateFastData() {
            fetchSubway();
            fetchAlerts();
            fetchSports();
        }
        
        function updateSlowData() {
            fetchWeather();
            fetchEvents();
        }

        updateFastData();
        updateSlowData();

        // Refreshes trains, alerts, games every minute
        setInterval(updateFastData, 60000); 

    </script>
